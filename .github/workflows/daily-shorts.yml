name: Daily Shorts Automation

on:
  schedule:
    # 하루 3회: UTC 00:00 / 12:00 / 17:00
    # = 미국 동부(EST) 기준 저녁 7시 / 아침 7시 / 낮 12시
    - cron: '0 0,12,17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg imagemagick
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji fonts-dejavu-core || true

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare fonts
        run: |
          mkdir -p assets/fonts
          if [ ! -f assets/fonts/DejaVuSans-Bold.ttf ]; then
            cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf assets/fonts/ 2>/dev/null || true
          fi
          if [ ! -f assets/fonts/NotoSansCJK-Bold.ttc ]; then
            cp /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc assets/fonts/ 2>/dev/null || true
          fi

      - name: Check required secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          mkdir -p logs
          set -o pipefail
          python - <<'PY' 2>&1 | tee logs/preflight.log
          import os
          required = [
              "SUPABASE_URL", "SUPABASE_SERVICE_KEY", "NVIDIA_API_KEY",
              "YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN",
          ]
          missing = []
          print("===== Secret preflight check =====")
          for k in required:
              v = os.environ.get(k, "")
              if v:
                  print(f"{k}: SET (length={len(v)})")
              else:
                  print(f"{k}: MISSING")
                  missing.append(k)
          if missing:
              raise SystemExit("MISSING SECRETS: " + ", ".join(missing))
          print("All required secrets present.")
          PY

      - name: Preflight connectivity checks
        env:
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL || 'z-ai/glm-5.3-flash' }}
          NVIDIA_MODEL_FAST: ${{ secrets.NVIDIA_MODEL_FAST || 'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning' }}
          NVIDIA_TEMPERATURE: ${{ secrets.NVIDIA_TEMPERATURE || '0.7' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TTS_VOICE: ${{ secrets.TTS_VOICE || 'en-US-GuyNeural' }}
          TTS_RATE: ${{ secrets.TTS_RATE || '+8%' }}
        run: |
          mkdir -p logs
          set -o pipefail
          python -m shorts_pipeline.preflight 2>&1 | tee logs/preflight_checks.log

      - name: Run daily pipeline
        id: pipeline
        env:
          PYTHONUNBUFFERED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_BASE_URL: ${{ secrets.NVIDIA_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL || 'z-ai/glm-5.3-flash' }}
          NVIDIA_MODEL_FAST: ${{ secrets.NVIDIA_MODEL_FAST || 'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning' }}
          NVIDIA_TEMPERATURE: ${{ secrets.NVIDIA_TEMPERATURE || '0.7' }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          SDXL_API_URL: ${{ secrets.SDXL_API_URL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS || 'unlisted' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TTS_VOICE: ${{ secrets.TTS_VOICE || 'en-US-GuyNeural' }}
          TTS_RATE: ${{ secrets.TTS_RATE || '+8%' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p logs
          set -o pipefail
          python -m shorts_pipeline.run_daily 2>&1 | tee logs/pipeline.log

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30

      - name: Commit run logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f logs/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: run logs ${{ github.run_id }}"
            git push
          else
            echo "No log changes to commit"
          fi

      - name: Notify failure
        if: failure()
        run: echo "Pipeline failed. Check logs artifact."
